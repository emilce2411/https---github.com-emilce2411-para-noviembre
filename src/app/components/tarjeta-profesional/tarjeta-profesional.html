<div class="card h-100 shadow-sm border-0 p-3 bg-white">
  <div class="card-body d-flex flex-column justify-content-between">
    <div>
      <img
        *ngIf="profesional.imagen_portfolio"
        [src]="normalizarUrlImagen(profesional.imagen_portfolio)"
        [alt]="'Foto de ' + profesional.nombre + ' ' + profesional.apellido"
        class="professional-photo mb-3"
      >

      <!-- Nombre y Apellido -->
      <h5 class="card-title text-primary fw-bold mb-2">
        {{ profesional.nombre }} {{ profesional.apellido }}
      </h5>
      
      <!-- Oficio -->
      <p class="mb-2">
        <strong>Oficio:</strong> 
        <span class="badge bg-info text-dark">{{ profesional.oficio_nombre }}</span>
      </p>
      
      <!-- Ubicación y Experiencia -->
      <p class="card-text text-muted mb-1 small">
        <strong>Ubicación:</strong> {{ profesional.ubicacion_nombre }}
      </p>
      <p class="card-text text-muted mb-2 small">
        <strong>Experiencia:</strong> {{ profesional.experiencia_anios }} años
      </p>
      
      <!-- Descripción -->
      <p class="card-text text-secondary small mt-2">
        {{ profesional.descripcion }}
      </p>

    </div>
    
    <!-- Footer de la tarjeta con estado y botón de WhatsApp -->
    <div class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top">
      <!-- Estado Verificado -->
      <span class="badge bg-success" *ngIf="profesional.verificado">✔ Verificado</span>
      <span class="badge bg-warning text-dark" *ngIf="!profesional.verificado">⏳ Pendiente</span>
      
      <!-- Botón Contactar por WhatsApp -->
      <a href="https://wa.me/{{ profesional.telefono }}" target="_blank" class="btn btn-success btn-sm d-flex align-items-center gap-1">
        Contactar
      </a>
    </div>

    <a [routerLink]="['/profesional', profesional.id]" class="btn btn-outline-primary btn-sm mt-3">
      Ver Perfil
    </a>
  </div>
</div>
