<div class="container my-5" style="max-width: 450px;">
  <div class="card shadow-sm border-0 p-4">
    <h2 class="text-center mb-4 fw-bold text-primary">Iniciar Sesión</h2>
    
    <form (ngSubmit)="enviarLogin()">
      <div class="mb-3">
        <label class="form-label">Nombre de Usuario</label>
        <input type="text" class="form-control" [(ngModel)]="credenciales.username" name="username" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input type="password" class="form-control" [(ngModel)]="credenciales.password" name="password" required>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mb-3">Ingresar</button>
      
      <div class="text-center">
        <small class="text-muted">¿No tienes cuenta? <a routerLink="/registro" class="text-decoration-none">Regístrate aquí</a></small>
      </div>
    </form>
  </div>
</div>
